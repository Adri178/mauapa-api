name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest

    # Real Postgres and Redis, not fakes. The concurrency test proves a
    # PostgreSQL exclusion constraint rejects overlapping bookings — against a
    # stub it would prove nothing at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mauapa
          POSTGRES_PASSWORD: mauapa
          POSTGRES_DB: mauapa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mauapa -d mauapa"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://mauapa:mauapa@localhost:5432/mauapa?schema=public
      REDIS_URL: redis://localhost:6379
      # Test-only values. Real secrets are set on the deployment platform.
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-00000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: the point is to catch a Dockerfile that stopped
      # working, which is exactly how the OpenSSL mismatch in this repo was
      # found — by running the image rather than reading it.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mauapa-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports unhealthy without a database
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL='postgresql://nobody:nobody@127.0.0.1:5432/nothing' \
            -e REDIS_URL='redis://127.0.0.1:6379' \
            -e JWT_ACCESS_SECRET='smoke-access-secret-that-is-long-enough-1' \
            -e JWT_REFRESH_SECRET='smoke-refresh-secret-that-is-long-enough' \
            mauapa-api:ci || true
          sleep 10
          # Without a database the entrypoint must fail loudly rather than serve
          # a half-working API.
          if docker logs smoke 2>&1 | grep -qi "migrat"; then
            echo "entrypoint attempted migrations as expected"
          else
            echo "entrypoint did not attempt migrations"; docker logs smoke; exit 1
          fi
