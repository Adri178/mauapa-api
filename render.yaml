# Render blueprint — the API container only.
#
# Postgres and Redis are deliberately NOT declared here. Hosts that provision
# databases for you attach a volume to each, and volumes are what push a free
# plan onto a paid one. Pointing at managed databases elsewhere keeps the whole
# stack on permanent free tiers with the architecture intact — Redis included,
# which matters because it is what makes broadcasts and rate limits correct
# across more than one instance.
#
# DATABASE_URL → a Neon project (neon.com)
# REDIS_URL    → a Redis Cloud database (redis.io)
#
# Both are `sync: false`, meaning Render prompts for them at deploy time and
# never stores them in this file. See README, "Deploying".

services:
  - type: web
    name: mauapa-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Reports database connectivity, not merely that the process is alive.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # PORT is intentionally absent: Render injects it, and hard-coding one
      # would leave the app listening somewhere Render is not looking.

      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # Generated once by Render and then held; never committed.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: THROTTLE_ENABLED
        value: true
      - key: THROTTLE_LIMIT
        value: 120
      - key: THROTTLE_TTL_SECONDS
        value: 60
