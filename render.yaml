# Render blueprint. Point Render at this repository and it provisions the API
# and its Postgres from this file.
#
# Redis is NOT declared here: Render's managed Redis ("Key Value") is created
# separately, and its connection string pasted into REDIS_URL below. Declaring
# something that may not provision cleanly would be worse than saying so.
#
# See README, "Deploying", for the manual steps and for Railway.

services:
  - type: web
    name: mauapa-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # Wired automatically from the database declared below.
      - key: DATABASE_URL
        fromDatabase:
          name: mauapa-postgres
          property: connectionString

      # Paste the connection string of your Render Key Value instance.
      - key: REDIS_URL
        sync: false

      # Generated once by Render and then held; never commit these.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: THROTTLE_ENABLED
        value: true
      - key: THROTTLE_LIMIT
        value: 120
      - key: THROTTLE_TTL_SECONDS
        value: 60

databases:
  - name: mauapa-postgres
    databaseName: mauapa
    user: mauapa
    plan: free
